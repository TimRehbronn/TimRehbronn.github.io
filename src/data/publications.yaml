- id: eisenblaetter2025maneuvering
  title: "Automated Maneuvering of Networked Vessels in Confined Waters"
  authors: [Nick Eisenblätter, Tim Rehbronn, Martin Kurowski, David Benz, Heike Vallery, Torsten Jeinsch]
  venue: "Journal of Physics: Conference Series, vol. 3123, 012020 (ICMASS 2025, Hamburg)"
  venueShort: "ICMASS 2025"
  year: 2025
  type: conference
  selected: true
  abstract: >-
    Maritime Autonomous Surface Ships technology has made substantial progress in recent years, yet challenges
    remain in safety-critical scenarios such as maneuvering through congested, constrained waterways like ports.
    This contribution presents an architecture for automated, networked, and cooperative maneuvering of multiple
    vessels with two core modules: cooperative perception and centralized collision avoidance planning. The
    environmental perception module combines LiDAR, radar, and GNSS-based navigation to enable accurate
    self-localization and robust object detection. Its cooperative multi-object tracking fuses onboard detections
    with AIS data and observations from other vessels. The module distinguishes between static and dynamic
    obstacles and feeds the shapes as convex polygons to the centralized collision avoidance planning module. The
    planning module uses optimal control to compute collision-free trajectories under geometric constraints.
    Cooperative maneuver planning addresses complex right-of-way situations by prioritizing and decomposing
    maneuvers into sequential sub-scenarios, with local control systems guiding individual vessels. We evaluate the
    approach experimentally in a maneuvering scenario in the port of Rostock involving two on-site and one simulated
    vessel. One of them is the 52m-long automated research vessel Deneb equipped with advanced sensors, which
    exchanges state and object information via conventional communication links. Results demonstrate the reliable
    localization of static and dynamic objects as well as collision-free automated maneuver execution. This
    cooperative behavior is an important step towards safe mixed traffic, including non-networked vessels.
