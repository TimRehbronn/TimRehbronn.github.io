- id: vankempen2023offset
  title: "Enhancing Lidar-Based Object Detection in Adverse Weather Using Offset Sequences in Time"
  authors: [Raphael van Kempen, Tim Rehbronn, Abin Jose, Johannes Stegmaier, Bastian Lampe, Timo Woopen, Lutz Eckstein]
  venue: "2023 International Conference on Electrical, Computer and Energy Technologies (ICECET), Cape Town, South Africa, pp. 1–6"
  venueShort: "IEEE ICECET 2023"
  year: 2023
  type: conference
  selected: false
  note: "Master's thesis"
  abstract: >-
    Automated vehicles require an accurate perception of their surroundings for safe and efficient driving.
    Lidar-based object detection is a widely used method for environment perception, but its performance is
    significantly affected by adverse weather conditions such as rain and fog. In this work, we investigate various
    strategies for enhancing the robustness of lidar-based object detection by processing sequential data samples
    generated by lidar sensors. Our approaches leverage temporal information to improve a lidar object detection
    model, without the need for additional filtering or pre-processing steps. We compare 10 different neural network
    architectures that process point cloud sequences including a novel augmentation strategy introducing a temporal
    offset between frames of a sequence during training and evaluate the effectiveness of all strategies on lidar
    point clouds under adverse weather conditions through experiments. Our research provides a comprehensive study of
    effective methods for mitigating the effects of adverse weather on the reliability of lidar-based object
    detection using sequential data that are evaluated using public datasets such as nuScenes, Dense, and the
    Canadian Adverse Driving Conditions Dataset. Our findings demonstrate that our novel method, involving temporal
    offset augmentation through randomized frame skipping in sequences, enhances object detection accuracy compared
    to both the baseline model (Pillar-based Object Detection) and no augmentation.
  links:
    doi: "https://doi.org/10.1109/ICECET58911.2023.10389489"
    arxiv: "https://arxiv.org/abs/2401.09049"
